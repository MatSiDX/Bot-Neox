<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AvalonBot</title>
  <link rel="icon" type="image/png" href="/assets/AvalonBot.png">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <main>
    <img src="/assets/AvalonBot.png" alt="AvalonBot">
    <h1>AvalonBot</h1>
    <p>Ingresa con Discord para administrar los servidores donde tienes permisos.</p>
    <form action="/login" method="get">
      <!--DASHBOARD_NEXT_INPUT-->
      <label>
        <input type="checkbox" name="remember" value="1" checked>
        Recordar este dispositivo
      </label>
      <button type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
